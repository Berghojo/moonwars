name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.MOONWARS_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Set up release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MOONWARS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MOONWARS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOONWARS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOONWARS_KEY_PASSWORD }}
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/moonwars.jks"
          {
            echo "MOONWARS_KEYSTORE_FILE=$RUNNER_TEMP/moonwars.jks"
            echo "MOONWARS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "MOONWARS_KEY_ALIAS=$KEY_ALIAS"
            echo "MOONWARS_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon testNonRootDebugUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon assembleNonRootRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/nonRoot/release/*.apk "dist/Moonwars-${GITHUB_REF_NAME//\//-}.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: Moonwars-apk
          path: dist/*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
